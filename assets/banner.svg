<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#060910" />
    </linearGradient>

    <!-- Cyan Glow -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Subdued Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.035)" stroke-width="1" />
      <circle cx="0" cy="0" r="1.2" fill="rgba(56, 189, 248, 0.25)" />
    </pattern>

    <!-- Radial Glows -->
    <radialGradient id="radialCyan" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.15)" />
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0)" />
    </radialGradient>
    <radialGradient id="radialIndigo" cx="20%" cy="80%" r="60%">
      <stop offset="0%" stop-color="rgba(99, 102, 241, 0.12)" />
      <stop offset="100%" stop-color="rgba(99, 102, 241, 0)" />
    </radialGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .cyan-text { fill: #38bdf8; }
    .emerald-text { fill: #34d399; }
    .muted-text { fill: #94a3b8; }
    .dim-text { fill: #475569; }
  </style>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />
  <rect width="100%" height="100%" fill="url(#radialCyan)" />
  <rect width="100%" height="100%" fill="url(#radialIndigo)" />

  <!-- Outer Border Frame -->
  <rect x="2" y="2" width="1196" height="356" rx="16" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5" />

  <!-- Tech Decorative Elements -->
  <g opacity="0.6">
    <!-- Top Left Terminal Dot Indicators -->
    <circle cx="40" cy="36" r="5" fill="#ef4444" />
    <circle cx="58" cy="36" r="5" fill="#f59e0b" />
    <circle cx="76" cy="36" r="5" fill="#10b981" />
    <text x="100" y="41" class="mono dim-text" font-size="12">gabriel.os // core-v2.6</text>

    <!-- Top Right Status -->
    <rect x="980" y="24" width="180" height="26" rx="6" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.3)" />
    <circle cx="996" cy="37" r="4" fill="#10b981" />
    <text x="1010" y="41" class="mono emerald-text" font-size="11" font-weight="600">DISPONÍVEL P/ PROJETOS</text>
  </g>

  <!-- Main Hero Content -->
  <!-- Monogram Watermark / Tech Crest on Left -->
  <g transform="translate(60, 95)">
    <!-- Octagonal Monogram Frame -->
    <polygon points="40,0 120,0 160,40 160,120 120,160 40,160 0,120 0,40" fill="rgba(56, 189, 248, 0.04)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.5" />
    <!-- Monogram GA Inner Lines -->
    <!-- G -->
    <polyline points="72,50 48,50 32,66 32,94 48,110 72,110 72,82 54,82" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- A -->
    <polyline points="92,110 110,50 128,110" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="99" y1="88" x2="121" y2="88" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" />
  </g>

  <!-- Name & Title -->
  <g transform="translate(260, 130)">
    <text x="0" y="10" class="mono cyan-text" font-size="14" font-weight="600" letter-spacing="2">FULL STACK SOFTWARE ENGINEER &amp; SYSTEMS ARCHITECT</text>
    <text x="0" y="60" class="sans" font-size="48" font-weight="800" fill="#f8fafc" letter-spacing="-1">Gabriel Arantes Silva</text>
    <text x="0" y="96" class="sans muted-text" font-size="18" font-weight="400">
      Construindo ERPs de alta densidade, arquiteturas resilientes e domínios tipados.
    </text>
  </g>

  <!-- Tech Badges Bar (Bottom) -->
  <g transform="translate(260, 270)">
    <!-- Badge 1: Next.js 15 & React 19 -->
    <rect x="0" y="0" width="160" height="32" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" />
    <text x="80" y="21" class="mono" font-size="12" fill="#e2e8f0" font-weight="500" text-anchor="middle">Next.js 15 · React 19</text>

    <!-- Badge 2: TypeScript & Clean Code -->
    <rect x="175" y="0" width="130" height="32" rx="6" fill="rgba(49, 120, 198, 0.1)" stroke="rgba(49, 120, 198, 0.4)" />
    <text x="240" y="21" class="mono" font-size="12" fill="#60a5fa" font-weight="500" text-anchor="middle">TypeScript</text>

    <!-- Badge 3: PostgreSQL & Supabase RLS -->
    <rect x="320" y="0" width="165" height="32" rx="6" fill="rgba(62, 207, 142, 0.1)" stroke="rgba(62, 207, 142, 0.4)" />
    <text x="402" y="21" class="mono" font-size="12" fill="#34d399" font-weight="500" text-anchor="middle">PostgreSQL · Supabase</text>

    <!-- Badge 4: Rust & Python Systems -->
    <rect x="500" y="0" width="145" height="32" rx="6" fill="rgba(249, 115, 22, 0.1)" stroke="rgba(249, 115, 22, 0.4)" />
    <text x="572" y="21" class="mono" font-size="12" fill="#fb923c" font-weight="500" text-anchor="middle">Docker · Vitest</text>

    <!-- Badge 5: Web OS & Canvas 2D -->
    <rect x="660" y="0" width="170" height="32" rx="6" fill="rgba(129, 140, 248, 0.1)" stroke="rgba(129, 140, 248, 0.4)" />
    <text x="745" y="21" class="mono" font-size="12" fill="#a5b4fc" font-weight="500" text-anchor="middle">Canvas 2D · Physics</text>
  </g>
</svg>
